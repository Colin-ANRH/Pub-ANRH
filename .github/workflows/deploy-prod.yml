name: Deploy prod OVH (pub.anrh.fr)

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-prod-ovh
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntaxe PHP (theme)
        run: |
          find wp-content/themes/anrhpub_theme -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file" || exit 1
          done

      - name: Securite — pas de mots de passe en dur
        run: |
          if grep -rE "Anrh-(Admin|Client)-[0-9]{4}" wp-content/themes/anrhpub_theme; then
            echo "::error::Mots de passe en dur detectes dans le theme"
            exit 1
          fi

      - name: Securite — migration PrestaShop CLI uniquement
        run: |
          grep -q "CLI uniquement" wp-content/themes/anrhpub_theme/tools/migrate-prestashop.php

      - name: Test generation wp-config (production)
        env:
          OVH_DB_PASSWORD: test-db-password
          DEPLOY_ENV: production
        run: |
          php deploy-ovh/build-wp-config.php
          grep -q "define( 'WP_ENVIRONMENT_TYPE', 'production' );" wp-config.php
          grep -q "define( 'WP_HOME', 'https://pub.anrh.fr' );" wp-config.php
          grep -q "define( 'WP_SITEURL', 'https://pub.anrh.fr' );" wp-config.php
          if grep -q "ANRH_STAGING_GATE" wp-config.php; then
            echo "::error::ANRH_STAGING_GATE detecte en prod — template incorrect."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build JS theme (Vite)
        working-directory: wp-content/themes/anrhpub_theme
        run: |
          npm install
          npm run build || python bin/build-main-js.py

      - name: PHPUnit (B2B, panier, devis)
        working-directory: wp-content/themes/anrhpub_theme
        run: |
          composer install --no-interaction --prefer-dist
          composer test

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Préparer le bundle de déploiement (prod)
        env:
          OVH_DB_PASSWORD_PROD: ${{ secrets.OVH_DB_PASSWORD_PROD }}
          OVH_DB_PASSWORD_STAGING: ${{ secrets.OVH_DB_PASSWORD }}
          DEPLOY_ENV: production
        run: |
          # Prefere le secret prod ; sinon reutilise le MDP deja utilise sur pub.anrh.fr
          export OVH_DB_PASSWORD="${OVH_DB_PASSWORD_PROD:-$OVH_DB_PASSWORD_STAGING}"
          if [ -z "$OVH_DB_PASSWORD" ]; then
            echo "::error::Aucun mot de passe DB (OVH_DB_PASSWORD_PROD ou OVH_DB_PASSWORD)"
            exit 1
          fi

          cd wp-content/themes/anrhpub_theme
          npm install
          npm run build || python bin/build-main-js.py
          cd ../../..

          php deploy-ovh/build-wp-config.php

          mkdir -p deploy-bundle/wp-content/themes
          mkdir -p deploy-bundle/wp-content/uploads
          mkdir -p deploy-bundle/wp-content/plugins

          cp wp-config.php deploy-bundle/

          # .htaccess production : pas de blocage/noindex staging
          cp deploy-ovh/htaccess.production.snippet deploy-bundle/.htaccess

          cp *.php deploy-bundle/

          cp wp-content/themes/index.php deploy-bundle/wp-content/themes/ 2>/dev/null || true

          for theme_dir in wp-content/themes/*/; do
            [ -d "$theme_dir" ] || continue
            theme_name=$(basename "$theme_dir")
            mkdir -p "deploy-bundle/wp-content/themes/$theme_name"
            if [ "$theme_name" = "anrhpub_theme" ]; then
              rsync -a --exclude='bin/' --exclude='tools/' --exclude='tests/' --exclude='vendor/' --exclude='node_modules/' "${theme_dir}/" "deploy-bundle/wp-content/themes/$theme_name/"
            else
              cp -r "${theme_dir}." "deploy-bundle/wp-content/themes/$theme_name/"
            fi
          done

          cp -r wp-content/uploads/* deploy-bundle/wp-content/uploads/ 2>/dev/null || true
          cp -r wp-content/plugins/* deploy-bundle/wp-content/plugins/

          # Ne jamais embarquer le verrou staging en prod
          rm -f deploy-bundle/wp-content/mu-plugins/anrh-staging-gate.php
          rm -f deploy-bundle/staging-health.php

          echo "REMOTE_DIR=pub.anrh.fr/" >> $GITHUB_ENV

      - name: Déployer sur OVH (FTP - prod)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          local-dir: deploy-bundle/
          server-dir: ${{ env.REMOTE_DIR }}
          state-name: ovh-pub-anrh-fr-prod
          log-level: minimal

      - name: Retirer le verrou staging restant sur prod (FTP)
        env:
          FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          FTP_USER: ${{ secrets.OVH_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set ftp:ssl-allow true;
            set ssl:verify-certificate no;
            open -u ${FTP_USER},${FTP_PASS} ${FTP_SERVER};
            cd pub.anrh.fr;
            rm -f wp-content/mu-plugins/anrh-staging-gate.php;
            rm -f staging-health.php;
            rm -f unzip-staging.php;
            bye
          " || echo "::warning::Suppression FTP partielle — verifiez manuellement anrh-staging-gate.php"

      - name: Smoke test (plus de gate staging)
        run: |
          code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 30 \
            -A "ANRH-Deploy-SmokeTest/1.0" \
            "https://pub.anrh.fr/wp-content/themes/anrhpub_theme/style.css" || echo "000")
          echo "HTTP $code"
          case "$code" in
            200|301|302)
              echo "Site accessible sans verrou staging."
              ;;
            401|403)
              echo "::error::HTTP $code — le verrou staging est peut-etre encore actif"
              exit 1
              ;;
            *)
              echo "::error::Site injoignable en prod (HTTP $code)"
              exit 1
              ;;
          esac

