name: Deploy staging OVH — complet (1ère fois)

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging-ovh-full
  cancel-in-progress: true

jobs:
  deploy-full:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Préparer wp-config + .htaccess staging
        env:
          OVH_DB_PASSWORD_STAGING: ${{ secrets.OVH_DB_PASSWORD_STAGING }}
          OVH_DB_PASSWORD_FALLBACK: ${{ secrets.OVH_DB_PASSWORD }}
          STAGING_GATE_USER: ${{ secrets.STAGING_GATE_USER }}
          STAGING_GATE_PASSWORD: ${{ secrets.STAGING_GATE_PASSWORD }}
          DEPLOY_ENV: staging
        run: |
          export OVH_DB_PASSWORD="${OVH_DB_PASSWORD_STAGING:-$OVH_DB_PASSWORD_FALLBACK}"
          php deploy-ovh/build-wp-config.php
          grep -q "anrservistgpub" wp-config.php
          cp deploy-ovh/.htaccess .htaccess

      - name: Préparer le site complet (hors outils locaux)
        run: |
          mkdir -p site-bundle
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='deploy-ovh/' \
            --exclude='site-bundle/' \
            --exclude='export*.sql' \
            --exclude='.gitignore' \
            --exclude='readme.html' \
            --exclude='license.txt' \
            --exclude='wp-content/updraft/' \
            --exclude='wp-content/upgrade/' \
            --exclude='wp-content/cache/' \
            --exclude='wp-content/themes/anrhpub_theme/node_modules/' \
            --exclude='wp-content/themes/anrhpub_theme/vendor/' \
            --exclude='wp-content/themes/anrhpub_theme/bin/' \
            --exclude='wp-content/themes/anrhpub_theme/tests/' \
            --exclude='wp-content/themes/anrhpub_theme/tools/' \
            ./ site-bundle/
          # Vérifie le mu-plugin staging
          test -f site-bundle/wp-content/mu-plugins/anrh-staging-gate.php
          test -f site-bundle/wp-config.php
          du -sh site-bundle
          find site-bundle -type f | wc -l

      - name: Déployer le site complet sur OVH (FTP → staging-pub/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          local-dir: site-bundle/
          server-dir: staging-pub/
          state-name: ovh-staging-pub-full-site
          log-level: standard
          timeout: 600000
