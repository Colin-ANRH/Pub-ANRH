name: Purge produits PROD (anr_product)

on:
  workflow_dispatch:

concurrency:
  group: purge-prod-products
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Préparer mu-plugin one-shot
        run: |
          mkdir -p purge-bundle/wp-content/mu-plugins
          cp deploy-ovh/anrh-purge-prod-products-once.php purge-bundle/wp-content/mu-plugins/

      - name: Uploader mu-plugin sur prod (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          local-dir: purge-bundle/
          server-dir: pub.anrh.fr/
          state-name: ovh-pub-anrh-fr-purge-products-mu
          log-level: standard

      - name: Instructions
        run: |
          echo "::notice::Mu-plugin de purge depose sur pub.anrh.fr"
          echo "Ouvrez https://pub.anrh.fr/ une fois dans le navigateur pour declencher la suppression de TOUS les produits."
          echo "Le mu-plugin s auto-supprime apres execution. Staging non touche."
