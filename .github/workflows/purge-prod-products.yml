name: Purge produits PROD (anr_product)

on:
  workflow_dispatch:

concurrency:
  group: purge-prod-products
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Préparer script
        run: |
          mkdir -p purge-bundle
          cp deploy-ovh/purge-prod-products.php purge-bundle/

      - name: Uploader script sur prod (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          local-dir: purge-bundle/
          server-dir: pub.anrh.fr/
          state-name: ovh-pub-anrh-fr-purge-products-v3
          log-level: standard

      - name: Instructions
        run: |
          echo "::notice::Ouvrez cette URL une seule fois pour purger la PROD :"
          echo "https://pub.anrh.fr/purge-prod-products.php?token=purge-anrh-20260729"
          echo "Staging non touche. Le script s auto-supprime."
